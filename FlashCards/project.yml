name: IFRFlashCards
options:
  bundleIdPrefix: com.tylercasey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  IFRCore:
    path: IFRCore
targets:
  IFRFlashCards:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: IFRCore
    entitlements:
      path: App/IFRFlashCards.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: IFR FlashCards
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylercasey.ifrflashcards
        # iPhone-only: portrait-only UI is not allowed on iPad (multitasking
        # requires all four orientations), and this app is designed portrait.
        TARGETED_DEVICE_FAMILY: 1
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  IFRFlashCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: IFRFlashCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IFRFlashCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: IFRFlashCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IFRFlashCards:
    build:
      targets:
        IFRFlashCards: all
    test:
      gatherCoverageData: false
      targets:
        - IFRFlashCardsTests
        - IFRFlashCardsUITests
